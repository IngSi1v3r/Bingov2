<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festival Bingo – Admin</title>

  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <!-- ADMIN LOGIN OVERLAY -->
  <div id="adminLoginOverlay" class="admin-login-overlay hidden">
    <div class="admin-login-modal">
      <h2>Admin Login</h2>
      <p class="admin-login-subtext">Bitte melde dich mit einem Admin-Account an.</p>

      <input id="adminLoginNameInput" type="text" placeholder="Admin-Name" />
      <input id="adminLoginPinInput" type="password" placeholder="Passwort" />

      <p id="adminLoginStatusText" class="admin-login-status"></p>

      <div class="admin-login-actions">
        <button id="adminDoLoginBtn" type="button">Login</button>
      </div>
    </div>
  </div>

<div class="app">

  <!-- STICKY ADMIN NAVIGATION -->
  <header class="admin-sticky-header">

    <!-- OBERE WERKZEUGLEISTE -->
    <div class="admin-toolbar">

      <!-- ADMINMENÜ -->
      <div class="admin-user-menu-wrapper">
        <button
          id="adminUserMenuBtn"
          class="admin-toolbar-btn admin-user-btn"
          type="button"
          aria-expanded="false"
          aria-controls="adminUserMenu"
        >
          <span class="admin-toolbar-icon" aria-hidden="true">👤</span>
          <span id="adminName" class="admin-toolbar-text">-</span>
        </button>

        <div id="adminUserMenu" class="admin-user-menu hidden">
          <button id="adminGoToGameBtn" type="button">
            Zum Spiel
          </button>

          <button id="adminLogoutBtn" type="button">
            Logout
          </button>
        </div>
      </div>

      <!-- SPIELAUSWAHL -->
      <button
        id="adminCurrentGameBtn"
        class="admin-toolbar-btn admin-game-select-btn"
        type="button"
      >
        <span class="admin-toolbar-icon" aria-hidden="true">🎮</span>
        <span id="adminCurrentGame" class="admin-toolbar-text">-</span>
        <span class="admin-toolbar-chevron" aria-hidden="true">▾</span>
      </button>

    </div>

    <!-- TABNAVIGATION -->
    <nav class="admin-tabs" aria-label="Adminbereiche">
      <button class="admin-tab active" data-tab="dashboard" type="button">
        Dashboard
      </button>

      <button class="admin-tab" data-tab="players" type="button">
        Spieler
      </button>

      <button class="admin-tab" data-tab="games" type="button">
        Spiele
      </button>

      <button class="admin-tab" data-tab="live" type="button">
        Live
      </button>

      <button class="admin-tab" data-tab="grid" type="button">
        Galerie
      </button>

      <button class="admin-tab" data-tab="logs" type="button">
        Logs
      </button>

      <button class="admin-tab" data-tab="push" type="button">
        Push
      </button>
    </nav>

  </header>

  <!-- ADMIN GAME SELECT OVERLAY -->
  <div id="adminGameSelectOverlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="closeAdminGameSelectBtn" class="modal-close-btn" type="button">×</button>

      <h2>Spiel auswählen</h2>

      <div id="adminGameList" class="game-list">
        <p>Spiele werden geladen...</p>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
    <div class="admin-content">
      <div class="admin-tab-content active" id="tab-dashboard"></div>
      <div class="admin-tab-content" id="tab-players"></div>
      <div class="admin-tab-content" id="tab-games"></div>
      <div class="admin-tab-content" id="tab-live"></div>
      <div class="admin-tab-content" id="tab-grid"></div>
      <div class="admin-tab-content" id="tab-logs"></div>
      <div class="admin-tab-content" id="tab-push"></div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script src="data_service.js"></script>
  <script src="polling_service.js"></script>

  <script src="auth.js"></script>
  <script src="admin_logs.js"></script>
  <script src="push_automation.js"></script>

  <script src="admin_players.js"></script>
  <script src="admin_players_ui.js"></script>

  <script src="admin_games.js"></script>
  <script src="admin_games_setup_wizard.js"></script>
  <script src="admin_live.js"></script>
  <script src="admin_dashboard.js"></script>
  <script src="admin_galerie.js"></script>
  <script src="admin_push.js"></script>
  <script src="admin_log_push_share.js"></script>

  <script src="admin.js"></script>
</body>
</html>
