<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festival Bingo – Admin</title>

  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <!-- ADMIN LOGIN OVERLAY -->
  <div id="adminLoginOverlay" class="admin-login-overlay hidden">
    <div class="admin-login-modal">
      <h2>Admin Login</h2>
      <p class="admin-login-subtext">Bitte melde dich mit einem Admin-Account an.</p>

      <input id="adminLoginNameInput" type="text" placeholder="Admin-Name" />
      <input id="adminLoginPinInput" type="password" placeholder="Passwort" />

      <p id="adminLoginStatusText" class="admin-login-status"></p>

      <div class="admin-login-actions">
        <button id="adminDoLoginBtn" type="button">Login</button>
      </div>
    </div>
  </div>

  <div class="app">
    <!-- HEADER -->
    <div class="header-card">
      <div class="header-top-row">
        <h1>Admin Panel</h1>

        <div class="header-top-actions">
          <button id="adminRefreshBtn" class="secondary-btn" type="button">Refresh</button>
          <button id="adminLogoutBtn" class="secondary-btn" type="button">Admin Logout</button>
          <button id="adminGoToGameBtn" class="secondary-btn admin-link-btn" type="button">Zum Spiel</button>
        </div>
      </div>

      <div class="header-controls">
        <div class="header-item">
          <div class="header-label">Admin</div>
          <div id="adminName" class="header-value">-</div>
        </div>

        <div class="header-item">
          <div class="header-label">Aktives Spiel</div>
          <button id="adminCurrentGameBtn" class="secondary-btn header-button" type="button">
            <span id="adminCurrentGame">-</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ADMIN GAME SELECT OVERLAY -->
    <div id="adminGameSelectOverlay" class="modal-overlay hidden">
      <div class="modal">
        <button id="closeAdminGameSelectBtn" class="modal-close-btn" type="button">×</button>

        <h2>Spiel auswählen</h2>

        <div id="adminGameList" class="game-list">
          <p>Spiele werden geladen...</p>
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="dashboard" type="button">Dashboard</button>
      <button class="admin-tab" data-tab="players" type="button">Spieler</button>
      <button class="admin-tab" data-tab="games" type="button">Spiele</button>
      <button class="admin-tab" data-tab="live" type="button">Live</button>
      <button class="admin-tab" data-tab="grid" type="button">Galerie</button>
      <button class="admin-tab" data-tab="logs" type="button">Logs</button>
      <button class="admin-tab" data-tab="push" type="button">Push</button>
    </div>

    <!-- CONTENT -->
    <div class="admin-content">
      <div class="admin-tab-content active" id="tab-dashboard"></div>
      <div class="admin-tab-content" id="tab-players"></div>
      <div class="admin-tab-content" id="tab-games"></div>
      <div class="admin-tab-content" id="tab-live"></div>
      <div class="admin-tab-content" id="tab-grid"></div>
      <div class="admin-tab-content" id="tab-logs"></div>
      <div class="admin-tab-content" id="tab-push"></div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script src="data_service.js"></script>
  <script src="polling_service.js"></script>

  <script src="auth.js"></script>
  <script src="admin_logs.js"></script>

  <script src="admin_players.js"></script>
  <script src="admin_players_ui.js"></script>

  <script src="admin_games.js"></script>
  <script src="admin_live.js"></script>
  <script src="admin_dashboard.js"></script>
  <script src="admin_galerie.js"></script>
  <script src="admin_push.js"></script>
  <script src="admin.js"></script>
</body>
</html>
